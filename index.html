<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fitness & Getränkelager Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#09090b',
              sky: '#00bfff',
              skyHover: '#0099cc',
              amber: '#f59e0b',
              emerald: '#10b981',
              rose: '#f43f5e'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      user-select: none;
      -webkit-user-select: none;
    }
    input, button, select {
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(24, 24, 27, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(9, 9, 11, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-brand-bg text-zinc-100 min-h-full font-sans antialiased flex flex-col justify-between relative overflow-x-hidden">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 transform -translate-y-4 pointer-events-none w-[90%] max-w-xs">
    <div class="glass-card px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-brand-sky/30">
      <div id="toast-icon" class="w-8 h-8 rounded-xl bg-brand-emerald/20 text-brand-emerald flex items-center justify-center font-bold text-sm">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <p id="toast-title" class="text-xs font-bold text-white">Erfolgreich</p>
        <p id="toast-msg" class="text-[11px] text-zinc-300">Eintrag gespeichert</p>
      </div>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="flex-1 max-w-sm mx-auto w-full p-4 flex flex-col pb-20 relative z-10">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between py-3 mb-4 border-b border-white/10">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-dumbbell text-brand-sky text-xl"></i>
        <h1 class="text-xl font-bold tracking-wide text-white">Workout & Lager</h1>
      </div>
    </header>

    <!-- TABS -->
    <div class="grid grid-cols-2 glass-card p-1 rounded-2xl border border-white/10 mb-4">
      <button id="tab-workout-btn" onclick="switchTab('workout')" class="py-2 text-sm font-medium rounded-xl transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm">
        <i class="fa-solid fa-person-running mr-1.5"></i> Training
      </button>
      <button id="tab-lager-btn" onclick="switchTab('lager')" class="py-2 text-sm font-medium rounded-xl transition-all text-zinc-400 hover:text-white">
        <i class="fa-solid fa-boxes-stacked mr-1.5"></i> Lager
      </button>
    </div>

    <!-- TAB 1: TRAINING / ÜBUNGEN REFERENZ -->
    <div id="tab-workout" class="space-y-4 flex-1">
      <div class="glass-card p-4 rounded-2xl space-y-4">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2 border-b border-white/10 pb-2">
          <i class="fa-solid fa-list-check text-brand-sky"></i> Training erfassen
        </h3>

        <!-- Übungs-Referenz Auswahl -->
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Übung auswählen</label>
          <select id="exercise-select" onchange="onExerciseChange()" class="w-full glass-input rounded-2xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-sky transition-colors">
            <option value="" disabled selected>Bitte Übung wählen...</option>
          </select>
        </div>

        <!-- Dynamische Felder für Krafttraining (Gewicht, Sets, Reps) -->
        <div id="fields-strength" class="space-y-3 hidden">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Gewicht (kg)</label>
              <input type="number" step="0.5" id="ex-weight" placeholder="0" class="w-full glass-input rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Wiederholungen (Reps)</label>
              <input type="number" id="ex-reps" placeholder="10" class="w-full glass-input rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
            </div>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Sätze (Sets)</label>
            <input type="number" id="ex-sets" placeholder="3" class="w-full glass-input rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
          </div>
        </div>

        <!-- Dynamische Felder für Cardio (Lauf min / Pace) -->
        <div id="fields-cardio" class="space-y-3 hidden">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Dauer (Minuten)</label>
              <input type="number" id="ex-duration" placeholder="30" class="w-full glass-input rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Pace (min/km)</label>
              <input type="text" id="ex-pace" placeholder="5:30" class="w-full glass-input rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
            </div>
          </div>
        </div>

        <button onclick="saveWorkout()" class="w-full py-3 bg-brand-sky text-zinc-950 font-bold rounded-2xl active:bg-brand-skyHover transition-all shadow-lg shadow-sky-950/40 mt-2">
          Eintrag speichern
        </button>
      </div>

      <!-- Letzte Einträge / Log -->
      <div class="glass-card p-4 rounded-2xl space-y-2">
        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Letzte Aktivitäten</h4>
        <div id="workout-log" class="space-y-2 text-xs text-zinc-300">
          <p class="text-zinc-500 italic">Noch keine Einträge heute.</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: LAGER (Dein bestehendes System) -->
    <div id="tab-lager" class="hidden space-y-4 flex-1">
      <div class="glass-card p-4 rounded-2xl text-center text-zinc-400">
        <p>Getränkelager-Ansicht (wie zuvor besprochen integriert).</p>
      </div>
    </div>

  </div>

  <script>
    // Master-Referenz aller Übungen mit automatischem Typ (strength / cardio)
    const masterExercises = [
      { id: 'bench', name: 'Bankdrücken (Chest)', type: 'strength' },
      { id: 'squat', name: 'Kniebeugen (Legs)', type: 'strength' },
      { id: 'deadlift', name: 'Kreuzheben (Back)', type: 'strength' },
      { id: 'ohp', name: 'Schulterdrücken', type: 'strength' },
      { id: 'pullup', name: 'Klimmzüge', type: 'strength' },
      { id: 'running', name: 'Laufen / Joggen (Cardio)', type: 'cardio' },
      { id: 'cycling', name: 'Radfahren (Cardio)', type: 'cardio' },
      { id: 'rowing', name: 'Rudern (Ergometer)', type: 'cardio' }
    ];

    function initExercises() {
      const select = document.getElementById('exercise-select');
      masterExercises.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex.id;
        opt.textContent = ex.name;
        select.appendChild(opt);
      });
    }

    // Erkennt den Typ anhand der Referenz und schaltet die Felder um
    function onExerciseChange() {
      const selectedId = document.getElementById('exercise-select').value;
      const exercise = masterExercises.find(ex => ex.id === selectedId);
      
      const strengthFields = document.getElementById('fields-strength');
      const cardioFields = document.getElementById('fields-cardio');

      if (!exercise) return;

      if (exercise.type === 'strength') {
        strengthFields.classList.remove('hidden');
        cardioFields.classList.add('hidden');
      } else if (exercise.type === 'cardio') {
        strengthFields.classList.add('hidden');
        cardioFields.classList.remove('hidden');
      }
    }

    function showToast(title, msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-title').innerText = title;
      document.getElementById('toast-msg').innerText = msg;

      toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    function saveWorkout() {
      const selectedId = document.getElementById('exercise-select').value;
      const exercise = masterExercises.find(ex => ex.id === selectedId);

      if (!exercise) {
        alert("Bitte wähle eine Übung aus!");
        return;
      }

      let details = "";
      if (exercise.type === 'strength') {
        const w = document.getElementById('ex-weight').value || 0;
        const r = document.getElementById('ex-reps').value || 0;
        const s = document.getElementById('ex-sets').value || 0;
        details = `${s} Sets à ${r} Reps mit ${w} kg`;
      } else {
        const d = document.getElementById('ex-duration').value || 0;
        const p = document.getElementById('ex-pace').value || "0:00";
        details = `${d} Min. bei ${p} Pace`;
      }

      showToast("Training gespeichert", `${exercise.name}: ${details}`);
      
      // Log aktualisieren
      const logContainer = document.getElementById('workout-log');
      if (logContainer.querySelector('.italic')) logContainer.innerHTML = '';
      
      const entry = document.createElement('div');
      entry.className = "p-2 glass-input rounded-xl flex justify-between items-center";
      entry.innerHTML = `<span class="font-semibold text-white">${exercise.name}</span><span class="text-brand-sky">${details}</span>`;
      logContainer.prepend(entry);
    }

    function switchTab(tab) {
      const workoutTab = document.getElementById('tab-workout');
      const lagerTab = document.getElementById('tab-lager');
      const workoutBtn = document.getElementById('tab-workout-btn');
      const lagerBtn = document.getElementById('tab-lager-btn');

      if (tab === 'workout') {
        workoutTab.classList.remove('hidden');
        lagerTab.classList.add('hidden');
        workoutBtn.className = "py-2 text-sm font-medium rounded-xl transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm";
        lagerBtn.className = "py-2 text-sm font-medium rounded-xl transition-all text-zinc-400 hover:text-white";
      } else {
        workoutTab.classList.add('hidden');
        lagerTab.classList.remove('hidden');
        lagerBtn.className = "py-2 text-sm font-medium rounded-xl transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm";
        workoutBtn.className = "py-2 text-sm font-medium rounded-xl transition-all text-zinc-400 hover:text-white";
      }
    }

    // Beim Start Initialisieren
    initExercises();
  </script>
</body>
</html>
